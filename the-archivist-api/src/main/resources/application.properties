spring.application.name=the-archivist-api

# Carga el .env de la carpeta actual o, si IntelliJ ejecuta desde la raíz, el de the-archivist-api/.
# Las variables de entorno reales del sistema tienen prioridad sobre el .env.
spring.config.import=optional:file:.env[.properties],optional:file:./the-archivist-api/.env[.properties]

# PostgreSQL (valores por defecto para desarrollo local; sobreescribe con el .env)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/the_archivist}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway crea y versiona las tablas; Hibernate solo valida que coincidan con las entidades
spring.flyway.schemas=the_archivist
spring.flyway.default-schema=the_archivist
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=the_archivist
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Halo API (la llave viene de HALO_API_KEY y nunca se escribe en el código)
halo.api.base-url=${HALO_API_BASE_URL:https://www.haloapi.com}
halo.api.key=${HALO_API_KEY:}
# Pausa mínima entre llamadas a la Halo API, compartida por TODO el backend (historial, Match Result, leaderboard,
# Metadata). El producto "Developer Access" permite 10 llamadas cada 10 s: 1200 ms deja margen.
halo.api.min-interval-ms=1200

# Las tareas programadas (ingesta, rastreo, limpieza) corren en paralelo en vez de esperarse en una sola hebra
spring.task.scheduling.pool.size=4

# Minutos que se considera "reciente" la última sincronización de un jugador
archivist.sync.ttl-minutes=15

# Metadata (mapas, playlists, temporadas, rangos CSR): se descarga al arrancar si falta o tiene más de N días
archivist.metadata.sync-on-startup=true
archivist.metadata.refresh-days=30

# Ingesta de Match Result: llena match_participants con TODOS los jugadores de cada partida (sin gamertag).
# Cada corrida pide a lo sumo max-matches-per-run partidas, una cada delay-between-calls-ms, y se detiene sola
# si la Halo API responde 401/403/429/5xx. Ajusta estos valores al límite de llamadas de tu llave.
archivist.ingestion.enabled=true
archivist.ingestion.initial-delay-ms=60000
archivist.ingestion.fixed-delay-ms=15000
archivist.ingestion.max-matches-per-run=100
# El ritmo real lo marca halo.api.min-interval-ms; esta pausa extra queda en 0.
archivist.ingestion.delay-between-calls-ms=0
archivist.ingestion.max-attempts=3
# Una partida sin terminar que empezó hace menos de estos minutos se deja pendiente (puede seguir jugándose)
archivist.ingestion.in-progress-grace-minutes=180

# Rastreo de jugadores: descubre a los mejores en el leaderboard oficial (solo trae el top 250 por cola) y recorre su
# historial de la partida más reciente a la más antigua. Cada jugador cuesta ~max-history-matches/25 llamadas de
# historial y luego una llamada de Match Result por partida: empieza con pocos y sube los valores midiendo el costo.
archivist.crawl.enabled=true
# Jugadores que se piden por cola clasificatoria (máximo 250)
archivist.crawl.top-players-per-playlist=250
# Gamertags extra separados por comas (opcional)
archivist.crawl.seed-gamertags=
# Opcional: fijar temporada y colas (UUID separados por comas) en vez de deducirlas de la Metadata
archivist.crawl.season-id=
archivist.crawl.playlist-ids=
# Partidas de matchmaking más recientes que se guardan de cada jugador
archivist.crawl.max-history-matches=300
archivist.crawl.max-players-per-run=4
archivist.crawl.max-pages-per-player=10
archivist.crawl.initial-delay-ms=150000
archivist.crawl.fixed-delay-ms=120000
archivist.crawl.refresh-hours=24
# Jugadores sin partidas recientes (el leaderboard incluye gente que dejó de jugar): historial corto y revisión espaciada
archivist.crawl.inactive-after-days=90
archivist.crawl.dormant-max-matches=25
archivist.crawl.dormant-refresh-days=30
archivist.crawl.max-attempts=3
archivist.crawl.discovery-initial-delay-ms=90000
# Tiempo mínimo entre dos descubrimientos completos, y cada cuánto se revisa si toca (o si hay que reintentar uno que
# no se completó porque la Halo API pidió esperar)
archivist.crawl.discovery-interval-ms=86400000
archivist.crawl.discovery-retry-ms=1800000

# Retención: la caché de historiales se limpia sola; las partidas para análisis (matches / match_participants) no
archivist.retention.player-cache-days=30
archivist.retention.purge-cron=0 30 4 * * *

# Orígenes permitidos para el frontend (React/Vite)
archivist.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Server
server.port=8080
